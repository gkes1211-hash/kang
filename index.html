<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- 이 페이지는 자기 자신('self') 말고는 어떤 서버에도 연결할 수 없다 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="theme-color" content="#5b4bff">
  <meta name="description" content="카메라 앞에서 몸으로 하는 아이들 게임 모음">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="체육시간">
  <title>체육시간</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script src="home.js" defer></script>
  <style>
    :root { font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif; color: #221f33; color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
      padding: calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
      background: #f1efff; word-break: keep-all;
    }
    main { width: 100%; max-width: 560px; text-align: center; }
    .logo { width: 84px; height: 84px; border-radius: 22px; box-shadow: 0 6px 20px rgba(61, 47, 214, 0.25); }
    h1 { font-size: clamp(30px, 8vw, 44px); margin: 10px 0 6px; color: #3d2fd6; }
    p.sub { margin: 0 0 22px; color: #6a6680; font-size: 18px; }
    a.game {
      display: flex; align-items: center; gap: 16px; text-align: left; text-decoration: none; color: inherit;
      background: #fff; border-radius: 24px; padding: 18px; margin-bottom: 14px; box-shadow: 0 6px 24px rgba(61, 47, 214, 0.12);
      border: 3px solid transparent; touch-action: manipulation;
    }
    a.game:hover, a.game:focus-visible { border-color: #5b4bff; outline: none; }
    a.game:active { transform: scale(0.98); }
    a.game img { width: 76px; height: 76px; border-radius: 18px; flex: none; }
    a.game b { display: block; font-size: 22px; margin-bottom: 4px; }
    a.game span { color: #6a6680; font-size: 16px; }
    a.game .go { margin-left: auto; font-size: 28px; color: #5b4bff; flex: none; }
    #install {
      margin-top: 6px; padding: 12px 20px; border: 0; border-radius: 16px; background: #5b4bff; color: #fff;
      font: inherit; font-size: 18px; font-weight: 800; box-shadow: 0 4px 0 #3d2fd6; cursor: pointer;
    }
    #install[hidden], #ios-hint[hidden] { display: none; }
    #ios-hint { margin: 8px 0 0; color: #3d2fd6; font-size: 15px; font-weight: 700; }
    .note { color: #6a6680; font-size: 13px; margin-top: 18px; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="icons/icon-192.png" alt="">
    <h1>즐거운 체육활동 🏃</h1>
    <p class="sub">카메라 앞에서 몸으로 하는 게임이에요. 하나 골라요!</p>
    <a class="game" href="mugunghwa/">
      <img src="mugunghwa/icons/icon-192.png" alt="">
      <div><b>무궁화 꽃이 피었습니다</b><span>카메라가 술래! 노래할 때 움직이고, 얼음! 하면 멈춰요</span></div>
      <span class="go" aria-hidden="true">›</span>
    </a>
    <a class="game" href="balloon/">
      <img src="balloon/icon.png" alt="">
      <div><b>풍선 터트리기</b><span>손을 휘저어 풍선을 터트리고, 폭탄은 피해요</span></div>
      <span class="go" aria-hidden="true">›</span>
    </a>
    <a class="game" href="byeok/">
      <img src="byeok/icons/icon-192.png" alt="">
      <div><b>벽 통과하기</b><span>다가오는 벽의 구멍 모양대로 몸을 맞춰 통과해요</span></div>
      <span class="go" aria-hidden="true">›</span>
    </a>
    <button type="button" id="install" hidden>📲 홈 화면에 설치하기</button>
    <p id="ios-hint" hidden>📲 홈 화면에 설치하려면: 공유 버튼 → "홈 화면에 추가"</p>
    <p class="note">🔒 카메라 영상은 이 기기 안에서만 써요. 저장하지도, 어디로 보내지도 않아요.</p>
  </main>
</body>
</html>
