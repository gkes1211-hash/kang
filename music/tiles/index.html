<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="theme-color" content="#120f2a">
  <meta name="description" content="내려오는 타일을 박자에 맞춰 누르면 노래가 연주되는 리듬 게임">
  <title>반짝 건반</title>
  <style>
    /* 밤하늘 무대: 가운데 네 줄 건반 판, 위에 점수 줄, 메뉴와 결과는 판 위에 뜨는 카드 */
    :root {
      --sky: #120f2a; --panel: #211c4a; --panel2: #2b2560; --line: rgba(255,255,255,.12);
      --ink: #f4f1ff; --mute: #b9b0e0; --gold: #ffd75e; --pink: #ff86c8; --bad: #ff7a8a;
      --font: "Jua", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; background: var(--sky); color: var(--ink); font-family: var(--font);
      -webkit-tap-highlight-color: transparent; overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; word-break: keep-all; }
    [hidden] { display: none !important; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    .ver { margin: 0; text-align: center; font-size: 11px; color: var(--mute); opacity: .6; }
    #board { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
    button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

    .screen { position: fixed; inset: 0; overflow-y: auto; display: flex; touch-action: pan-y; background: rgba(10, 8, 28, .66);
      padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
      padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
    .card { width: 100%; max-width: 460px; margin: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 24px;
      padding: 22px 18px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
    .back { align-self: flex-start; color: var(--mute); text-decoration: none; font-size: 15px; padding: 6px 2px; }
    .back:hover { color: var(--ink); }
    .logo { text-align: center; display: flex; flex-direction: column; gap: 6px; }
    .logo h1 { margin: 0; font-size: clamp(34px, 10vw, 46px); letter-spacing: .02em; line-height: 1.1; text-wrap: balance; }
    .logo h1 span { display: inline-block; }
    .logo p { margin: 0; color: var(--mute); font-size: 16px; line-height: 1.5; }
    .keys { display: flex; justify-content: center; gap: 5px; margin-bottom: 4px; }
    .keys i { width: 26px; height: 40px; border-radius: 7px; background: var(--c); font-style: normal; font-size: 12px; color: #1b1530;
      display: flex; align-items: flex-end; justify-content: center; padding-bottom: 4px; }

    .label { font-size: 13px; letter-spacing: .08em; color: var(--mute); margin: 0 0 8px; }
    .songs { display: flex; flex-direction: column; gap: 8px; }
    .songview { display: flex; flex-direction: column; gap: 16px; }
    .cats { display: flex; flex-direction: column; gap: 10px; }
    .cat { display: flex; align-items: center; gap: 14px; text-align: left; padding: 14px; border-radius: 18px; background: var(--panel2); border: 2px solid transparent; transition: transform .08s; }
    .cat:hover { border-color: var(--c); }
    .cat:active { transform: scale(.97); }
    .cat .em { width: 58px; height: 58px; flex: none; border-radius: 16px; display: grid; place-items: center; font-size: 32px; background: rgba(255,255,255,.07); box-shadow: inset 0 -4px 0 var(--c); }
    .cat .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .cat b { font-size: 24px; font-weight: 400; color: var(--c); }
    .cat small { color: var(--mute); font-size: 13px; line-height: 1.4; }
    .cat .n { flex: none; text-align: right; color: var(--mute); font-size: 13px; line-height: 1.5; font-variant-numeric: tabular-nums; }
    .songhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .songhead b { font-size: 22px; font-weight: 400; }
    .chip { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 7px 12px; font-size: 14px; color: var(--mute); }
    .song:active { transform: scale(.98); }
    .song { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 10px; text-align: left; padding: 12px 14px;
      background: var(--panel2); border: 2px solid transparent; border-radius: 16px; }
    .song.on { border-color: var(--gold); background: #352d74; }
    .song b { font-size: 19px; font-weight: 400; }
    .song small { grid-column: 1; color: var(--mute); font-size: 13px; line-height: 1.4; }
    .song .lv { color: var(--gold); font-size: 12px; letter-spacing: 2px; text-align: right; }
    .song .best { grid-column: 2; grid-row: 2; text-align: right; font-size: 13px; color: var(--gold); white-space: nowrap; }

    .opts { display: grid; gap: 10px; }
    .opt { display: grid; grid-template-columns: 70px minmax(0, 1fr); align-items: center; gap: 10px; }
    .opt > span { color: var(--mute); font-size: 15px; }
    .seg { display: flex; background: var(--sky); border-radius: 12px; padding: 3px; gap: 3px; min-width: 0; }
    .seg button { flex: 1; min-width: 0; border: 0; background: none; border-radius: 9px; padding: 9px 4px; font-size: 15px; color: var(--mute); }
    .seg button.on { background: var(--panel2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }

    .big { border: 0; border-radius: 18px; padding: 16px; font-size: 22px; background: linear-gradient(180deg, #ffe27a, #ffb84a); color: #2a1b00;
      box-shadow: 0 6px 0 #c9822b; transition: transform .08s; }
    .big:active { transform: translateY(4px); box-shadow: 0 2px 0 #c9822b; }
    .ghost { border: 2px solid var(--line); background: none; border-radius: 16px; padding: 12px; font-size: 17px; }
    .row { display: flex; gap: 10px; }
    .row > * { flex: 1; }
    .tip { margin: 0; text-align: center; color: var(--mute); font-size: 13px; line-height: 1.6; }
    kbd { font-family: inherit; background: var(--panel2); border-radius: 5px; padding: 1px 6px; border: 1px solid var(--line); }

    .hud { position: fixed; left: 0; right: 0; top: 0; pointer-events: none; display: flex; align-items: center; gap: 10px;
      padding-top: max(10px, env(safe-area-inset-top, 0px)); padding-bottom: 10px;
      padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
      background: linear-gradient(180deg, rgba(18,15,42,.92), rgba(18,15,42,0)); }
    .hud button { pointer-events: auto; width: 42px; height: 42px; flex: none; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); font-size: 16px; }
    .hud .t { flex: 1; min-width: 0; }
    .hud .t b { display: block; font-weight: 400; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.12); margin-top: 6px; overflow: hidden; }
    .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--pink), var(--gold)); border-radius: 3px; }
    .hud .hearts { color: var(--pink); font-size: 20px; letter-spacing: 1px; white-space: nowrap; }
    .hud .score { font-size: 22px; min-width: 64px; text-align: right; font-variant-numeric: tabular-nums; color: var(--gold); }
    .hud.shake { animation: shake .3s; }
    @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

    .result h2, .pause h2 { margin: 0; text-align: center; font-size: 32px; font-weight: 400; }
    .stars { display: flex; justify-content: center; gap: 8px; font-size: 52px; line-height: 1; }
    .stars span { color: rgba(255,255,255,.15); }
    .stars span.on { color: var(--gold); text-shadow: 0 0 18px rgba(255,215,94,.6); animation: pop .4s backwards; }
    .stars span.on:nth-child(2) { animation-delay: .15s; } .stars span.on:nth-child(3) { animation-delay: .3s; }
    @keyframes pop { from { transform: scale(0) rotate(-40deg); } 70% { transform: scale(1.25); } }
    .final { text-align: center; font-size: 44px; color: var(--gold); font-variant-numeric: tabular-nums; line-height: 1; }
    .final small { display: block; font-size: 15px; color: var(--pink); margin-top: 6px; }
    .counts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; }
    .counts div { background: var(--panel2); border-radius: 12px; padding: 10px 4px; }
    .counts b { display: block; font-size: 22px; font-weight: 400; font-variant-numeric: tabular-nums; }
    .counts span { font-size: 12px; color: var(--mute); }
    @media (prefers-reduced-motion: reduce) { .stars span.on, .hud.shake { animation: none; } }
  </style>
  <script src="game.js?v=6" defer></script>
</head>
<body>
  <canvas id="board" aria-label="건반 판: 내려오는 타일을 박자에 맞춰 눌러요"></canvas>

  <div class="hud" id="hud" hidden>
    <button type="button" id="pauseBtn" aria-label="잠깐 멈추기">❚❚</button>
    <div class="t"><b id="hudTitle"></b><div class="bar"><i id="hudBar"></i></div></div>
    <span class="hearts" id="hudHearts"></span>
    <span class="score" id="hudScore">0</span>
  </div>

  <div class="screen" id="menu">
    <div class="card">
      <a class="back" href="../">← 🎵 음악</a>
      <div class="logo">
        <div class="keys" id="legend" aria-hidden="true"></div>
        <h1><span>반짝</span> <span>건반</span></h1>
        <p>타일이 선에 닿을 때 톡! 누르면<br>내가 누른 대로 노래가 흘러나와요.</p>
      </div>
      <div id="catView">
        <p class="label">어떤 노래를 칠까요?</p>
        <div class="cats" id="cats"></div>
      </div>
      <div id="songView" class="songview" hidden>
      <div class="songhead"><button type="button" class="chip" id="catBack">← 갈래 고르기</button><b id="catName"></b></div>
      <div class="songs" id="songs"></div>
      <div class="opts">
        <div class="opt"><span>난이도</span><div class="seg" data-opt="diff">
          <button type="button" data-val="easy">쉬움</button><button type="button" data-val="normal">보통</button><button type="button" data-val="hard">어려움</button></div></div>
        <div class="opt"><span>하트</span><div class="seg" data-opt="hearts">
          <button type="button" data-val="3">하트 3개</button><button type="button" data-val="inf">끝까지 연습</button></div></div>
        <div class="opt"><span>배경 음악</span><div class="seg" data-opt="band">
          <button type="button" data-val="on">켜기</button><button type="button" data-val="off">끄기</button></div></div>
      </div>
      <button type="button" class="big" id="startBtn">시작하기</button>
      </div>
      <p class="tip">타일 색은 음 이름 색이에요. 긴 타일은 끝까지 꾹 누르면 보너스!<br>줄로 이어진 두 타일은 같이 눌러요.<br>컴퓨터에서는 <kbd>D</kbd> <kbd>F</kbd> <kbd>J</kbd> <kbd>K</kbd> 키로도 칠 수 있어요.</p>
      <p class="ver" id="ver"></p>
    </div>
  </div>

  <div class="screen pause" id="pause" hidden>
    <div class="card">
      <h2>잠깐 멈춤</h2>
      <button type="button" class="big" id="resumeBtn">계속하기</button>
      <div class="row">
        <button type="button" class="ghost" id="restartBtn2">처음부터</button>
        <button type="button" class="ghost" id="menuBtn2">곡 고르기</button>
      </div>
    </div>
  </div>

  <div class="screen result" id="result" hidden>
    <div class="card">
      <h2 id="resTitle"></h2>
      <div class="stars" id="resStars"></div>
      <div class="final" id="resScore"></div>
      <div class="counts" id="resCounts"></div>
      <p class="tip" id="resNote"></p>
      <button type="button" class="big" id="againBtn">다시 하기</button>
      <button type="button" class="ghost" id="menuBtn">곡 고르기</button>
    </div>
  </div>
</body>
</html>
