<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- 이 페이지는 자기 자신('self') 말고는 어떤 서버에도 연결하지 않는다. 기록은 이 기기에만 저장된다. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="theme-color" content="#1769d6">
  <meta name="description" content="왕초보를 위한 여행 영어: 단어 외우기, 따라 말하기, 듣기, 역할극 회화">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="여행 영어">
  <title>여행 영어 첫걸음</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <script src="data.js" defer></script>
  <script src="data-2.js" defer></script>
  <script src="data-3.js" defer></script>
  <script src="data-4.js" defer></script>
  <script src="data-5.js" defer></script>
  <script src="data-6.js" defer></script>
  <script src="speech.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div id="app">
    <header class="top">
      <h1 id="top-title">여행 영어 첫걸음</h1>
      <span id="top-streak" class="streak" title="연속 공부한 날"></span>
    </header>

    <main id="view" tabindex="-1"></main>

    <nav class="tabs" aria-label="메뉴">
      <button type="button" data-tab="today"><span aria-hidden="true">🏠</span>오늘</button>
      <button type="button" data-tab="levels"><span aria-hidden="true">🪜</span>단계</button>
      <button type="button" data-tab="words"><span aria-hidden="true">📚</span>단어장</button>
      <button type="button" data-tab="settings"><span aria-hidden="true">⚙️</span>설정</button>
    </nav>
  </div>

  <!-- 문제 풀기·회화 화면 (전체 화면) -->
  <section id="play" hidden aria-modal="true" role="dialog">
    <div class="play-bar">
      <button type="button" class="icon-btn" id="play-close" aria-label="그만하기">✕</button>
      <div class="progress" aria-hidden="true"><i id="play-progress"></i></div>
      <span id="play-count" class="play-count"></span>
    </div>
    <div id="play-body" class="play-body"></div>
  </section>

  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
