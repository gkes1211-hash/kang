<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f7cf6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="오늘 공부">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../icons/kid-192.png" type="image/png">
<link rel="apple-touch-icon" href="../icons/kid-apple-touch-icon.png">
</head>
<body>
<title>오늘 공부</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a kid's single column — big check buttons, one job per card, the "tell mom" button always last. */
:root{
  --bg:#eaf4ff; --surface:#ffffff; --surface-2:#f2f7fd; --line:#dbe6f2; --line-strong:#b9cbe0;
  --ink:#17233a; --ink-2:#50607a; --ink-3:#95a3b8;
  --accent:#2f7cf6; --accent-soft:#dde9ff; --good:#20a463; --good-soft:#dcf3e6;
  --sun:#ffc233; --sun-soft:#fff3cf; --sun-ink:#8a5a00; --danger:#d64545;
  --strong-bg:#17233a; --strong-fg:#ffffff; --heat0:#e3ebf5;
  --shadow:0 2px 0 rgba(30,60,110,.06),0 6px 18px rgba(30,60,110,.07);
  --font:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1622; --surface:#18212f; --surface-2:#202b3b; --line:#2a3647; --line-strong:#3a4a60;
  --ink:#eaf1fb; --ink-2:#a9b7cb; --ink-3:#6d7c92;
  --accent:#6aa5ff; --accent-soft:#1c2d4a; --good:#4fd18c; --good-soft:#173426;
  --sun:#ffcf5a; --sun-soft:#3a2f12; --sun-ink:#ffd877; --danger:#ff8080;
  --strong-bg:#eaf1fb; --strong-fg:#0f1622; --heat0:#263347; --shadow:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1622; --surface:#18212f; --surface-2:#202b3b; --line:#2a3647; --line-strong:#3a4a60;
  --ink:#eaf1fb; --ink-2:#a9b7cb; --ink-3:#6d7c92;
  --accent:#6aa5ff; --accent-soft:#1c2d4a; --good:#4fd18c; --good-soft:#173426;
  --sun:#ffcf5a; --sun-soft:#3a2f12; --sun-ink:#ffd877; --danger:#ff8080;
  --strong-bg:#eaf1fb; --strong-fg:#0f1622; --heat0:#263347; --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;font-family:var(--font);color:var(--ink);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent;word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}

.top{display:flex;align-items:flex-start;gap:12px}
.top .grow{flex:1;min-width:0}
.eyebrow{font-size:13px;font-weight:800;color:var(--accent);letter-spacing:.08em}
h1{font-size:clamp(27px,8vw,34px);font-weight:900;letter-spacing:-.03em;margin:0;line-height:1.2;text-wrap:balance}
.date{color:var(--ink-2);font-size:16px;font-weight:700;margin-top:2px}
.gear{width:48px;height:48px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-size:22px;cursor:pointer;flex:none}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:6px;background:var(--surface);border-radius:20px;margin:16px 0 14px;box-shadow:0 0 0 6px var(--bg),var(--shadow)}
.tab{border:0;background:transparent;border-radius:15px;padding:10px 0;font-size:16px;font-weight:800;color:var(--ink-2);cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);color:#fff}

#view{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:24px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-size:20px;font-weight:900;margin:0;letter-spacing:-.02em}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.card-h .meta{font-size:14px;color:var(--ink-2)}
.muted{color:var(--ink-2)} .small{font-size:14px}
.empty{color:var(--ink-2);font-size:15px;text-align:center;padding:16px 8px;background:var(--surface-2);border-radius:16px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 16px;font-weight:800;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent}
.btn.dark{background:var(--strong-bg);color:var(--strong-fg);border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:11px}
.btn.wide{width:100%}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions>*{flex:1}

/* hero */
.hero{display:flex;gap:14px;align-items:center}
.face{font-size:52px;line-height:1;flex:none}
.hero h2{font-size:22px}
.hero p{margin:2px 0 0;color:var(--ink-2);font-size:15px}
.stars{display:flex;flex-wrap:wrap;gap:4px;font-size:26px;line-height:1}
.stars span{color:var(--heat0);transition:transform .2s}
.stars span.on{color:var(--sun);transform:scale(1.08)}
.momstamp{display:inline-flex;gap:6px;align-items:center;font-weight:900;color:var(--sun-ink);background:var(--sun-soft);border-radius:999px;padding:4px 12px;font-size:14px;align-self:flex-start}
.sample{background:var(--sun-soft);color:var(--sun-ink);border-radius:16px;padding:12px 14px;font-size:14px;font-weight:700}

.chip{display:inline-flex;align-items:center;padding:1px 10px;border-radius:9px;font-size:13.5px;font-weight:800;background:var(--cbg);color:var(--cfg);border:1px solid var(--cbd);white-space:nowrap;line-height:1.6}

/* items */
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;background:var(--surface-2);border-radius:18px;padding:14px;border:2px solid transparent;min-width:0}
.item.is-done{background:var(--good-soft)}
.item-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.item-title{font-weight:900;font-size:18px;line-height:1.35}
.item.is-done .item-title{color:var(--ink-2)}
.meta-row{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:14px;color:var(--ink-2)}
.memo{font-size:14px;color:var(--ink-2);background:var(--surface);border-radius:10px;padding:4px 10px;align-self:flex-start}
.memo-btn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:19px;cursor:pointer;flex:none}
.check{width:58px;height:58px;border-radius:18px;border:3px solid var(--line-strong);background:var(--surface);flex:none;display:grid;place-items:center;cursor:pointer;color:transparent;transition:background .15s,border-color .15s,transform .15s}
.check svg{width:30px;height:30px}
.check[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.check:active{transform:scale(.92)}

.hw{display:flex;flex-direction:column;gap:10px;background:var(--surface-2);border-radius:18px;padding:14px}
.hw-h{display:flex;gap:10px;align-items:flex-start}
.hw-h .grow{flex:1;min-width:0}
.dday{font-weight:900;color:var(--accent)}
.dday.soon{color:var(--sun-ink)}
.dday.late{color:var(--danger)}
.step{display:flex;align-items:center;gap:10px;border:0;background:var(--surface);border-radius:14px;padding:8px 12px 8px 8px;text-align:left;cursor:pointer;width:100%;font-weight:700;font-size:16px}
.step .ck{width:36px;height:36px;border-radius:11px;border:2.5px solid var(--line-strong);display:grid;place-items:center;color:transparent;flex:none}
.step .ck svg{width:20px;height:20px}
.step[aria-pressed="true"] .ck{background:var(--good);border-color:var(--good);color:#fff}
.step[aria-pressed="true"] span:last-child{color:var(--ink-3);text-decoration:line-through}
.hw.is-done{background:var(--good-soft)}

/* tell mom */
.tell{background:var(--accent-soft);border:2px dashed color-mix(in srgb,var(--accent) 45%,transparent);box-shadow:none;text-align:center;align-items:stretch}
.tell.ready{background:var(--sun-soft);border:2px solid var(--sun)}
.tell .big{font-size:19px;padding:18px;border-radius:18px}
.tell.ready .big{background:var(--sun);color:#3d2800;border-color:transparent;box-shadow:0 4px 0 color-mix(in srgb,var(--sun) 60%,#000)}
.tell p{margin:0;color:var(--ink-2);font-size:15px;font-weight:700}
.sent{color:var(--good);font-weight:900}

/* week */
.day{gap:8px}
.day.today{outline:3px solid var(--accent);outline-offset:-3px}
.day-h{display:flex;align-items:center;gap:8px}
.day-h b{font-size:18px;font-weight:900}
.day-h .d{color:var(--ink-2);font-size:14px}
.day-h .r{margin-left:auto;font-weight:900;font-variant-numeric:tabular-nums}
.wrow{display:flex;align-items:center;gap:8px;border:0;background:none;padding:5px 0;cursor:pointer;text-align:left;width:100%;font-size:15.5px}
.wrow .ck{width:24px;height:24px;flex:none;border-radius:8px;border:2px solid var(--line-strong);display:grid;place-items:center;color:transparent}
.wrow .ck svg{width:15px;height:15px}
.wrow.done .ck{background:var(--good);border-color:var(--good);color:#fff}
.wrow.done .wt{color:var(--ink-3)}
.wrow .wt{flex:1;min-width:0}

/* modal */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:rgba(8,14,26,.5)}
.sheet{position:relative;width:100%;max-width:560px;max-height:90%;overflow:auto;background:var(--surface);border-radius:26px 26px 0 0;padding:22px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:up .2s ease}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@media (min-width:620px){.modal{align-items:center}.sheet{border-radius:26px}}
.sheet h3{margin:0;font-size:21px;font-weight:900}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.lbl{font-size:14px;font-weight:800;color:var(--ink-2)}
input,textarea{font:inherit;font-size:16px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);width:100%;min-width:0}
textarea{resize:vertical;min-height:90px}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick label{cursor:pointer}
.pick input{position:absolute;opacity:0;width:1px;height:1px}
.pick span{display:inline-block;padding:9px 14px;border-radius:14px;border:2px solid var(--line);font-weight:800;font-size:15.5px;background:var(--surface)}
.pick label:has(input:checked) span{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.pick label:has(input:focus-visible) span{outline:3px solid var(--accent);outline-offset:2px}
.report{white-space:pre-wrap;background:var(--surface-2);border-radius:14px;padding:12px;font-size:14px;max-height:30vh;overflow:auto}
.err{color:var(--danger);font-size:14px;font-weight:800;min-height:1em}
.steps-guide{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;color:var(--ink-2);font-weight:700}
.steps-guide b{color:var(--ink)}
.or{display:flex;align-items:center;gap:10px;color:var(--ink-3);font-size:14px;font-weight:700}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

#toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--strong-bg);color:var(--strong-fg);padding:12px 20px;border-radius:16px;font-weight:900;font-size:15px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70;width:100%;height:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="grow">
      <div class="eyebrow">오늘 공부</div>
      <h1 id="hello">안녕! 👋</h1>
      <div class="date" id="today"></div>
    </div>
    <button class="gear" data-act="settings" aria-label="설정">⚙️</button>
  </header>
  <nav class="tabs" role="tablist" aria-label="화면" id="tabs">
    <button class="tab" role="tab" data-act="tab" data-tab="today">오늘</button>
    <button class="tab" role="tab" data-act="tab" data-tab="week">이번 주</button>
    <button class="tab" role="tab" data-act="tab" data-tab="hw">숙제</button>
  </nav>
  <main id="view" aria-live="polite"></main>
</div>
<div class="modal" id="modal" hidden><div class="backdrop" data-act="closeModal"></div><div class="sheet" role="dialog" aria-modal="true" id="sheet"></div></div>
<div id="toast" role="status"></div>
<canvas id="fx" hidden></canvas>

<script src="../core.js"></script>
<script>
(() => {
'use strict';
const H = window.HB;
const {DOW, today, addDays, dowOf, mondayOf, md, mdw, diffDays, esc, CHECK} = H;
const KEY = 'homebase.kid.v1';
let K = H.load(KEY);
const save = () => { if (K) H.save(KEY, K); };
const ui = { tab:'today' };
try { const t = sessionStorage.getItem('hbk.tab'); if (t) ui.tab = t; } catch (e) {}

const chip = id => H.chip(K, id);
const itemsFor = k => H.itemsFor(K, k);
const isDone = (k,id) => H.isDone(K, k, id);
const dayStats = k => H.dayStats(K, k);
const $ = s => document.querySelector(s);
const val = id => { const e = document.getElementById(id); return e ? e.value.trim() : ''; };

/* ---------- render ---------- */
function render() {
  const t = today(), d = H.parse(t);
  $('#today').textContent = `${d.getMonth()+1}월 ${d.getDate()}일 ${DOW[d.getDay()]}요일`;
  $('#hello').textContent = K && K.name ? `안녕, ${K.name}! 👋` : '안녕! 👋';
  $('#tabs').hidden = !K;
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === ui.tab)));
  $('#view').innerHTML = K ? VIEWS[ui.tab]() : welcome();
}

function welcome() {
  return `<section class="card">
    <h2>반가워요! 엄마 플래너랑 연결해요 🔗</h2>
    <ol class="steps-guide">
      <li>엄마 폰 플래너 › 오늘 › <b>📲 아이 기기로 보내기</b></li>
      <li>엄마가 보낸 카톡 글을 <b>길게 눌러 복사</b></li>
      <li>아래 칸에 <b>붙여 넣고 연결하기</b></li>
    </ol>
    <textarea id="code" rows="4" placeholder="엄마가 보낸 글을 여기에 붙여 넣어요"></textarea>
    <div class="err" id="err"></div>
    <div class="actions"><button class="btn" data-act="paste" data-to="code">📋 붙여넣기</button><button class="btn primary" data-act="link">연결하기</button></div>
    <div class="or">또는</div>
    <button class="btn" data-act="sample">예시로 먼저 둘러보기</button>
  </section>`;
}

const VIEWS = {
today() {
  const k = today(), st = dayStats(k), items = itemsFor(k);
  const all = st.total > 0 && st.done === st.total;
  let face, title, sub;
  if (!st.total) { face = '🌈'; title = '오늘은 쉬는 날!'; sub = '정해진 공부가 없어요. 신나게 놀아요.'; }
  else if (all) { face = '🤩'; title = '오늘 공부 다 했어!'; sub = '아래 노란 버튼으로 엄마한테 알려요.'; }
  else { face = !st.done ? '✏️' : st.done/st.total < .5 ? '💪' : '😊'; title = `${st.total}개 중 ${st.done}개 했어!`; sub = st.total-st.done === 1 ? '하나만 더 하면 끝!' : `${st.total-st.done}개 남았어요. 하나씩 해 볼까요?`; }
  const hws = K.homework.filter(h => !h.done && h.due <= addDays(k,3)).sort((a,b) => a.due.localeCompare(b.due));
  const sent = K.sent && K.sent[k];
  return `
  ${K.sample?'<div class="sample">지금은 예시 화면이에요. ⚙️ › 엄마 코드 넣기로 진짜 공부를 불러와요.</div>':''}
  <section class="card">
    <div class="hero"><div class="face" aria-hidden="true">${face}</div><div class="grow"><h2>${title}</h2><p>${sub}</p></div></div>
    ${st.total?`<div class="stars" aria-label="${st.total}개 중 ${st.done}개">${items.map(i => `<span class="${isDone(k,i.id)?'on':''}">★</span>`).join('')}</div>`:''}
    ${K.stamps && K.stamps[k]?'<span class="momstamp">⭐ 엄마가 확인 도장을 찍었어요</span>':''}
  </section>
  ${st.total?`<section class="card">
    <h2>오늘 할 공부</h2>
    <div class="list">${items.map(i => itemCard(k,i)).join('')}</div>
  </section>`:''}
  ${hws.length?`<section class="card">
    <div class="card-h"><h2>곧 내야 하는 숙제</h2><span class="meta">3일 안</span></div>
    <div class="list">${hws.map(hwCard).join('')}</div>
  </section>`:''}
  <section class="card tell ${all?'ready':''}">
    ${sent?`<p class="sent">✓ ${H.hm(sent)}에 엄마한테 알렸어요</p>`:all?'<p>다 했으면 엄마한테 알려 줘요!</p>':st.total?`<p>아직 ${st.total-st.done}개 남았어요. 지금까지 한 것도 알릴 수 있어요.</p>`:''}
    <button class="btn big ${all?'':'primary'}" data-act="tell">${all?'🎉 엄마한테 다 했다고 알리기':sent?'📨 엄마한테 다시 알리기':'📨 지금까지 한 것 엄마한테 알리기'}</button>
  </section>`;
},
week() {
  const t = today(), ws = mondayOf(t);
  let html = '';
  for (let i = 0; i < 7; i++) {
    const k = addDays(ws,i), st = dayStats(k), items = itemsFor(k);
    const all = st.total && st.done === st.total;
    html += `<section class="card day ${k===t?'today':''}">
      <div class="day-h"><b>${DOW[dowOf(k)]}요일</b><span class="d">${md(k)}${k===t?' · 오늘':''}</span><span class="r">${K.stamps && K.stamps[k]?'⭐ ':''}${all?'🌟 ':''}${st.done}/${st.total}</span></div>
      ${items.map(it => `<button class="wrow ${isDone(k,it.id)?'done':''}" data-act="toggle" data-date="${k}" data-id="${it.id}" aria-pressed="${isDone(k,it.id)}"><span class="ck">${CHECK}</span>${chip(it.subj)}<span class="wt">${esc(it.title)}</span></button>`).join('') || '<div class="muted small">쉬는 날이에요</div>'}
    </section>`;
  }
  const tot = [...Array(7)].reduce((a,_,i) => { const s = dayStats(addDays(ws,i)); a[0]+=s.done; a[1]+=s.total; return a; }, [0,0]);
  return `<section class="card"><div class="card-h"><h2>이번 주 별</h2><span class="meta">${md(ws)} — ${md(addDays(ws,6))}</span></div>
    <div class="stars" aria-label="이번 주 ${tot[1]}개 중 ${tot[0]}개">${'<span class="on">★</span>'.repeat(tot[0])}${'<span>★</span>'.repeat(Math.max(0,tot[1]-tot[0]))}</div>
    <p class="muted small" style="margin:0">이번 주 ${tot[1]}개 중 <b>${tot[0]}개</b> 했어요</p></section>${html}`;
},
hw() {
  const todo = K.homework.filter(h => !h.done).sort((a,b) => a.due.localeCompare(b.due));
  const done = K.homework.filter(h => h.done);
  return `<section class="card"><h2>해야 할 숙제</h2><div class="list">${todo.map(hwCard).join('') || '<div class="empty">남은 숙제가 없어요 👏</div>'}</div></section>
  ${done.length?`<section class="card"><h2>끝낸 숙제</h2><div class="list">${done.map(hwCard).join('')}</div></section>`:''}`;
},
};

function itemCard(k, i) {
  const d = isDone(k,i.id), memo = K.days[k] && K.days[k].memo && K.days[k].memo[i.id];
  return `<div class="item ${d?'is-done':''}">
    <div class="item-main">
      <div class="item-title">${esc(i.title)}</div>
      <div class="meta-row">${chip(i.subj)}${i.detail?`<span>${esc(i.detail)}</span>`:''}${i.min?`<span>⏱ ${i.min}분</span>`:''}</div>
      ${memo?`<div class="memo">💬 ${esc(memo)}</div>`:''}
    </div>
    <button class="memo-btn" data-act="memo" data-date="${k}" data-id="${i.id}" aria-label="메모 남기기">💬</button>
    <button class="check" data-act="toggle" data-date="${k}" data-id="${i.id}" aria-pressed="${d}" aria-label="${esc(i.title)} ${d?'다시 안 한 걸로':'했어요'}">${CHECK}</button>
  </div>`;
}
function hwCard(h) {
  const p = H.hwSteps(h);
  const ready = !h.done && (p.total === 0 || p.done === p.total);
  return `<div class="hw ${h.done?'is-done':''}">
    <div class="hw-h"><div class="grow"><div class="item-title">${esc(h.title)}</div>
      <div class="meta-row">${chip(h.subj)}<span>${mdw(h.due)} 까지 · ${h.done?'<b class="sent">끝!</b>':H.ddayHtml(h.due)}${p.total?` · ${p.done}/${p.total}`:''}</span></div>
      ${h.memo?`<div class="memo">📝 ${esc(h.memo)}</div>`:''}</div></div>
    ${h.steps.map(s => `<button class="step" data-act="step" data-h="${h.id}" data-s="${s.id}" aria-pressed="${s.done}"><span class="ck">${CHECK}</span><span>${esc(s.t)}</span></button>`).join('')}
    ${h.done?`<button class="btn sm" data-act="hwDone" data-h="${h.id}">다시 할 숙제로</button>`:`<button class="btn ${ready?'primary':''}" data-act="hwDone" data-h="${h.id}">✓ 숙제 끝!</button>`}
  </div>`;
}

/* ---------- toast / modal / fx ---------- */
let tt;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2200); }
let M = {};
function openModal(html, h = {}) { M = h; $('#sheet').innerHTML = html; $('#modal').hidden = false; }
function closeModal() { $('#modal').hidden = true; $('#sheet').innerHTML = ''; M = {}; }
function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = $('#fx'), ctx = c.getContext('2d'); c.hidden = false;
  const W = c.width = innerWidth * devicePixelRatio, Hh = c.height = innerHeight * devicePixelRatio;
  const cols = ['#ffc233','#2f7cf6','#20a463','#ff6b8b','#a879ff'];
  const ps = [...Array(140)].map(() => ({x:W/2+(Math.random()-.5)*W*.3, y:Hh*.55, vx:(Math.random()-.5)*W*.022, vy:-(Math.random()*.03+.012)*Hh, r:(Math.random()*6+4)*devicePixelRatio, c:cols[Math.random()*cols.length|0], a:Math.random()*6}));
  let f = 0;
  (function tick() {
    ctx.clearRect(0,0,W,Hh);
    for (const p of ps) { p.x += p.vx; p.y += p.vy; p.vy += Hh*.0011; p.a += .2; ctx.fillStyle = p.c; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillRect(-p.r/2,-p.r/3,p.r,p.r*.66); ctx.restore(); }
    if (++f < 110) requestAnimationFrame(tick); else { ctx.clearRect(0,0,W,Hh); c.hidden = true; }
  })();
}

/* ---------- kid → mom message ---------- */
const NOTES = ['다 했어요! 😊','어려운 게 있었어요 🤔','엄마 도와주세요 🙋','칭찬해 주세요 ⭐'];
async function buildMessage(k, note) {
  const st = dayStats(k), all = st.total && st.done === st.total;
  const lines = [all ? `🎉 엄마! 오늘 공부 다 했어요!` : `📨 엄마! 지금까지 ${st.total}개 중 ${st.done}개 했어요`, `${mdw(k)} · ${st.done}/${st.total}`, ''];
  for (const i of itemsFor(k)) { lines.push(`${isDone(k,i.id)?'✅':'⬜'} ${H.subj(K,i.subj).name} · ${i.title}`); const m = K.days[k]?.memo?.[i.id]; if (m) lines.push(`   💬 ${m}`); }
  const hws = K.homework.filter(h => (!h.done && h.due <= addDays(k,3)) || (h.done && h.doneAt === k));
  if (hws.length) { lines.push(''); for (const h of hws) { const p = H.hwSteps(h); lines.push(`📚 ${h.title} · ${h.done?'끝!':`${p.done}/${p.total} 진행 중`}`); } }
  if (note) lines.push('', `💬 ${note}`);
  lines.push('', '— 엄마 앱 › 아이 소식 넣기에 이 글을 붙여 넣으면 체크가 들어가요', await H.encode(H.kidPacket(K, k, note)));
  return lines.join('\n');
}

/* ---------- actions ---------- */
const A = {
  tab(el) { ui.tab = el.dataset.tab; try { sessionStorage.setItem('hbk.tab', ui.tab); } catch (e) {} render(); scrollTo({top:0}); },
  toggle(el) {
    const k = el.dataset.date, id = el.dataset.id, before = dayStats(k);
    const d = H.materialize(K,k); if (d.done[id]) delete d.done[id]; else d.done[id] = true;
    save(); render();
    const after = dayStats(k);
    if (after.total && after.done === after.total && before.done !== before.total) { confetti(); toast(k === today() ? '오늘 공부 다 했어! 🎉 엄마한테 알려요' : '이날 공부 다 했어! 🎉'); }
    else if (d.done[id]) toast(['잘했어! 👍','좋아요! ✨','멋져요! 💪','하나 끝! ⭐'][Math.random()*4|0]);
  },
  memo(el) {
    const k = el.dataset.date, id = el.dataset.id, it = H.rawItems(K,k).find(i => i.id === id); if (!it) return;
    const cur = K.days[k]?.memo?.[id] || '';
    const quick = ['쉬웠어요 😊','어려웠어요 😥','엄마랑 같이 볼래요','다 못 했어요'];
    openModal(`<h3>💬 ${esc(it.title)}</h3>
      <div class="pick">${quick.map(q => `<label><input type="radio" name="q" value="${esc(q)}" ${q===cur?'checked':''}><span>${q}</span></label>`).join('')}</div>
      <div class="field"><label for="memoIn">하고 싶은 말 (직접 써도 돼요)</label><textarea id="memoIn" placeholder="예) 5번 문제 모르겠어요">${quick.includes(cur)?'':esc(cur)}</textarea></div>
      <div class="actions"><button class="btn" data-act="closeModal">닫기</button><button class="btn primary" data-act="m" data-h="ok">저장</button></div>`,
    { ok() { const q = $('#sheet input[name="q"]:checked'); const v = val('memoIn') || (q ? q.value : '');
        const d = H.materialize(K,k); if (v) d.memo[id] = v; else delete d.memo[id]; save(); closeModal(); render(); toast('메모를 남겼어요'); } });
  },
  step(el) {
    const h = K.homework.find(x => x.id === el.dataset.h), s = h && h.steps.find(x => x.id === el.dataset.s); if (!s) return;
    s.done = !s.done; save(); render();
    if (s.done && h.steps.every(x => x.done)) toast('다 했어요! ‘숙제 끝!’을 눌러요');
  },
  hwDone(el) {
    const h = K.homework.find(x => x.id === el.dataset.h); if (!h) return;
    h.done = !h.done; h.doneAt = h.done ? today() : '';
    if (h.done) h.steps.forEach(s => s.done = true);
    save(); render(); if (h.done) { confetti(); toast('숙제 끝! 최고예요 👏'); }
  },
  async tell() {
    const k = today();
    let note = dayStats(k).done === dayStats(k).total && dayStats(k).total ? NOTES[0] : '';
    let text = await buildMessage(k, note);
    const sent = how => { (K.sent ||= {})[k] = new Date().toISOString(); save(); closeModal(); render(); toast(how); };
    const draw = () => {
      const phone = (K.momPhone || '').replace(/[^0-9+]/g,'');
      openModal(`<h3>📨 엄마한테 알리기</h3>
        <div class="field"><span class="lbl">엄마한테 한마디</span><div class="pick">${NOTES.map(n => `<label><input type="radio" name="note" value="${esc(n)}" ${n===note?'checked':''}><span>${n}</span></label>`).join('')}</div></div>
        <div class="field"><label for="noteIn">직접 쓰기 (안 써도 돼요)</label><input id="noteIn" placeholder="예) 오늘 수학 진짜 어려웠어요" value="${NOTES.includes(note)?'':esc(note)}"></div>
        <details><summary class="muted small">보낼 글 미리 보기</summary><div class="report">${esc(text)}</div></details>
        <div class="actions" style="flex-direction:column">
          ${navigator.share?'<button class="btn primary big" data-act="m" data-h="share">💛 카톡으로 보내기</button>':''}
          ${phone?`<a class="btn ${navigator.share?'':'primary'}" id="smsLink" href="sms:${phone}?&body=${encodeURIComponent(text)}" data-act="m" data-h="sms">✉️ 문자로 보내기</a>`:''}
          <button class="btn ${navigator.share||phone?'':'primary'}" data-act="m" data-h="copy">📋 복사해서 보내기</button>
        </div>
        ${phone?'':'<p class="muted small" style="margin:0">⚙️ 설정에 엄마 번호를 넣으면 문자로 바로 보낼 수 있어요.</p>'}`, H2);
    };
    const refresh = async () => {
      const r = $('#sheet input[name="note"]:checked'); const typed = val('noteIn');
      note = typed || (r ? r.value : ''); text = await buildMessage(k, note);
      const rep = $('#sheet .report'); if (rep) rep.textContent = text;
      const a = $('#smsLink'); if (a) a.href = `sms:${(K.momPhone||'').replace(/[^0-9+]/g,'')}?&body=${encodeURIComponent(text)}`;
    };
    const H2 = {
      async share() { try { await navigator.share({text}); sent('엄마한테 보냈어요! 💌'); confetti(); } catch (e) { if (e.name !== 'AbortError') toast('보내기가 안 돼요. ‘복사해서 보내기’를 써 주세요'); } },
      sms(el, e) { setTimeout(() => sent('문자 앱을 열었어요. 보내기를 눌러요'), 300); },
      async copy() { try { await navigator.clipboard.writeText(text); sent('복사했어요! 카톡 엄마 방에 붙여 넣어 보내요'); } catch (e) { toast('복사가 안 돼요. 미리 보기 글을 길게 눌러 복사해요'); const d = $('#sheet details'); if (d) d.open = true; } },
    };
    H2.change = refresh;
    draw();
  },
  settings() {
    openModal(`<h3>⚙️ 설정</h3>
      <div class="field"><label for="code2">엄마 코드 넣기</label><textarea id="code2" rows="3" placeholder="엄마가 카톡으로 보낸 글을 통째로 붙여 넣어요"></textarea>
        <div class="err" id="err"></div>
        <div class="actions"><button class="btn" data-act="paste" data-to="code2">📋 붙여넣기</button><button class="btn primary" data-act="m" data-h="link">넣기</button></div>
        <span class="muted small">${K && K.momAt ? `엄마가 마지막으로 보낸 때: ${mdw(H.ymd(new Date(K.momAt)))} ${H.hm(K.momAt)}` : '아직 엄마 코드를 넣지 않았어요.'}</span></div>
      ${K?`<div class="field"><label for="phone">엄마 휴대폰 번호 (문자로 보내기용, 안 넣어도 돼요)</label><input id="phone" type="tel" inputmode="tel" value="${esc(K.momPhone||'')}" placeholder="010-0000-0000"></div>
      <div class="actions"><button class="btn" data-act="closeModal">닫기</button><button class="btn dark" data-act="m" data-h="save">저장</button></div>
      <button class="btn sm danger" data-act="m" data-h="reset">이 기기 기록 모두 지우기</button>`:'<div class="actions"><button class="btn" data-act="closeModal">닫기</button></div>'}`,
    { async link() { await linkFrom('code2'); },
      save() { K.momPhone = val('phone'); save(); closeModal(); render(); toast('저장했어요'); },
      reset() { openModal(`<h3>정말 다 지울까요?</h3><p class="muted" style="margin:0">이 기기의 체크와 메모가 모두 지워져요. 엄마 앱 기록은 그대로예요.</p><div class="actions"><button class="btn" data-act="closeModal">그만두기</button><button class="btn danger" data-act="m" data-h="yes">지우기</button></div>`,
        { yes() { K = null; try { localStorage.removeItem(KEY); } catch (e) {} closeModal(); render(); } }); } });
  },
  async paste(el) { const t = document.getElementById(el.dataset.to); try { t.value = await navigator.clipboard.readText(); } catch (e) { t.focus(); toast('칸을 길게 눌러 붙여넣기 해요'); } },
  async link() { await linkFrom('code'); },
  sample() { K = H.defaultState(); K.sample = true; K.linked = false; K.name = ''; save(); ui.tab = 'today'; render(); },
  closeModal() { closeModal(); },
  m(el, e) { const f = M[el.dataset.h]; if (f) f(el, e); },
};
async function linkFrom(id) {
  let p;
  try { p = await H.decode(val(id)); } catch (e) { $('#err').textContent = '엄마가 보낸 글을 찾지 못했어요. 글 전체를 붙여 넣었는지 봐 주세요.'; return; }
  if (p.k !== 'mom') { $('#err').textContent = '이건 내가 엄마한테 보낸 글이에요. 엄마가 보낸 글을 넣어 주세요.'; return; }
  const first = !K || K.sample;
  if (first) K = {v:1, name:'', subjects:[], routine:{}, days:{}, homework:[], stamps:{}, sent:{}, momPhone:(K && K.momPhone) || ''};
  H.applyMomPacket(K, p); save(); closeModal(); ui.tab = 'today'; render();
  toast(first ? '엄마랑 연결됐어요! 🎉' : '엄마가 보낸 공부를 넣었어요');
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const f = A[el.dataset.act]; if (!f) return;
  if (el.tagName !== 'A') e.preventDefault();
  f(el, e);
});
document.addEventListener('change', e => { if (e.target.closest('#sheet') && M.change) M.change(); });
document.addEventListener('input', e => { if (e.target.id === 'noteIn' && M.change) M.change(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });
let lastDay = today();
document.addEventListener('visibilitychange', () => { if (!document.hidden && today() !== lastDay) { lastDay = today(); render(); } });

render();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !/claude/.test(location.hostname)) navigator.serviceWorker.register('../sw.js').catch(() => {});
})();
</script>
</body>
</html>
